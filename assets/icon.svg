<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="DocSigner">
  <title>DocSigner</title>
  <!--
    The one logo source. scripts/make_assets.py renders every icon in the repo
    from this file, so edit here and rerun that.

    The tile is full bleed, which is what browser extensions, favicons and
    Windows want. macOS is the exception: its dock icons sit inside a margin,
    so the generator widens the viewBox before packing the .icns rather than
    keeping a second copy of the artwork.

    The mark is drawn in a 24-unit grid (Lucide's "signature"), placed so its
    inked bounding box, stroke included, is centred in the tile and spans just
    over half of it. Those two numbers are measured from a render, not guessed;
    changing the stroke width or the paths means measuring again.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dcd7d"/>
      <stop offset="1" stop-color="#37a862"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="229" fill="url(#tile)"/>

  <g transform="translate(184 197) scale(27.4)"
     fill="none" stroke="#06110a" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m21 17-2.156-1.868A.5.5 0 0 0 18 15.5v.5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1c0-2.545-3.991-3.97-8.5-4a1 1 0 0 0 0 5c4.153 0 4.745-11.295 5.708-13.5a2.5 2.5 0 1 1 3.31 3.284"/>
    <path d="M3 21h18"/>
  </g>
</svg>
