<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenSigner</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 20px;
      color: #1a1a1a;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    #origin {
      display: block;
      font-family: monospace;
      font-size: 13px;
      background: #f2f2f2;
      border-radius: 4px;
      padding: 6px 8px;
      margin: 10px 0;
      word-break: break-all;
    }
    p { margin: 0 0 6px; color: #444; }
    .buttons { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
    button {
      font: inherit;
      padding: 6px 18px;
      border-radius: 4px;
      border: 1px solid #bbb;
      background: #fff;
      cursor: pointer;
    }
    #allow { background: #1a56db; border-color: #1a56db; color: #fff; }
  </style>
</head>
<body>
  <h1>Allow access to your certificates?</h1>
  <span id="origin"></span>
  <p>This site wants to list your signing certificates and ask for signatures. Your PIN stays on this computer and is never shown to the site.</p>
  <div class="buttons">
    <button id="deny">Deny</button>
    <button id="allow">Allow</button>
  </div>
  <script src="consent.js"></script>
</body>
</html>
