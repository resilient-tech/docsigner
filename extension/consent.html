<!DOCTYPE html>
<!--
  data-theme="paper" is pinned, deliberately, and it is the whole reason this
  page can drop its hardcoded colours.

  The dialog used to state only its text colour, which left near-black on
  whatever ground the browser supplied: on a dark-mode machine the heading
  naming what is being consented to came out black on black. The fix then was
  `color-scheme: light` plus five literal hex values, including a blue
  (#1a56db) that was a fifth accent nobody approved.

  Pinning PAPER gets the same guarantee from the design system instead. Every
  colour below resolves, both are stated, and the page inherits the product's
  palette rather than approximating it. A signing consent prompt on warm stock
  is also the right picture: this is a document act.

  tokens.css here is generated by design/sync.py from design/tokens.css, because
  the extension ships as a zip of this folder with no build step. CI checks it
  is current.
-->
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <title>DocSigner</title>
  <link rel="icon" href="icons/icon128.png">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* No webfont: a three-line dialog does not need one, and the extension
       should not carry 28 KB to render one sentence. */
    body {
      font-family: var(--font);
      font-size: var(--text-sm);
      line-height: var(--lh-dense);
      margin: 0;
      padding: var(--s-5);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: var(--text-body);
      font-weight: var(--fw-semibold);
      line-height: var(--lh-display);
      margin: 0 0 var(--s-2);
    }

    #origin {
      display: block;
      font-family: var(--mono);
      font-size: var(--text-xs);
      background: var(--well);
      border: var(--hairline);
      border-radius: var(--radius-card);
      padding: var(--s-2);
      margin: var(--s-3) 0;
      word-break: break-all;
    }

    p {
      margin: 0 0 var(--s-1);
      color: var(--dim);
    }

    /* Hidden until the check comes back saying there is something to say.
       The Callout recipe, minus the box: amber ink, and the tone means
       "something you should know", not "something failed". */
    #update {
      display: none;
      margin: var(--s-3) 0 0;
      font-size: var(--text-xs);
      color: var(--amber-ink);
    }
    #update.show { display: block; }
    #update a { color: var(--amber-ink); }

    .buttons {
      margin-top: var(--s-4);
      display: flex;
      gap: var(--s-2);
      justify-content: flex-end;
    }

    /* The Button recipe. Deny is `default`, Allow is `primary`: the mint fill
       is the affirmative action, and --on-accent sits on it at 9.5:1. The old
       Deny border was #bbb, 1.9:1 on white, so the button that refuses a site
       access to your certificates had no visible edge. */
    button {
      font: inherit;
      font-weight: var(--fw-semibold);
      height: var(--control-h-sm);
      padding-inline: var(--control-px-md);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    button:hover { background: var(--hover); }

    #allow {
      background: var(--green);
      border-color: transparent;
      color: var(--on-accent);
    }
    #allow:hover { background: var(--green-hover); }

    /* The one ring, with its ground-coloured inner band, so it stays visible
       on the mint fill. The dialog had no focus style at all. */
    button:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
  </style>
</head>
<body>
  <h1>Allow access to your certificates?</h1>
  <span id="origin"></span>
  <p>This site wants to list your signing certificates and ask for signatures. Your PIN stays on this computer and is never shown to the site.</p>
  <p id="update"></p>
  <div class="buttons">
    <button id="deny">Deny</button>
    <button id="allow">Allow</button>
  </div>
  <script src="consent.js"></script>
</body>
</html>
