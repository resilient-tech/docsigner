[package]
name = "opensigner-host"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "OpenSigner native messaging host: DSC token access over PKCS#11 and the OS certificate stores"
license = "Apache-2.0"

[[bin]]
name = "opensigner-host"
path = "src/main.rs"

[dependencies]
cryptoki = "0.10"
pcsc = "2"
x509-cert = { version = "0.2", features = ["pem"] }
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["oid"] }
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = { version = "0.4", features = ["std"] }
dirs = "5"
notify-rust = "4"

# Blocking HTTP for the update check only. native-tls uses the TLS stack already
# on the machine (Schannel / SecureTransport / OpenSSL), which keeps ~2 MB of
# bundled rustls out of the binary for the sake of one JSON fetch.
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "gzip"] }
native-tls = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
