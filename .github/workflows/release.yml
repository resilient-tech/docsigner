name: Release

# Merging into master is the release. Work lands on develop; when a batch of it
# is ready, merge it. Nothing else. `prepare` works out which folders changed
# since the last tag, patch-bumps those components and the release number,
# commits that back to master, and the rest builds, tags and publishes.
#
# Nobody types a version for an ordinary release. A bigger bump is the one
# manual case, typed on develop before the merge, and the automatic pass leaves
# that component alone because its number has already moved:
#
#     python scripts/bump_version.py core minor
#
# Every component carries its own number, because each is published somewhere
# different, and a number that moves for nothing means a store review or a
# registry upload with an empty changelog. `VERSION` numbers the release that
# carries them all; the desktop app has none of its own, being a bundle of core
# and host, so it ships as the release.
#
# This is the one workflow that pushes a commit, and `prepare`'s `if:` is what
# stops that push starting another release.
#
# Run it with workflow_dispatch to check the builds without publishing. A manual
# run bumps nothing and pushes nothing.
#
# ---------------------------------------------------------------------------
# Why one architecture per OS, deliberately
#
# Someone who just wants to sign a PDF should never have to know what "arm64"
# means. Every extra download on the page is a chance to pick the wrong one, so
# each OS gets exactly one, and the choice is made here rather than by the user.
#
# macOS: x86_64 only.
#   Runs on every Mac since 2010, Apple Silicon included, through Rosetta.
#   More importantly it is the safer side of the PKCS#11 bet: an x86_64 process
#   can load an x86_64 driver and (through Rosetta's own translation) the
#   x86_64 half of a universal one, while an arm64 process cannot load an
#   x86_64-only driver at all. Some Indian CA middleware still ships x86_64
#   only. Measured on a real WatchData ProxKey: its dylib happens to be
#   universal and both builds reach the token, so this is insurance against the
#   vendors that have not caught up, not a fix for that one.
#   Verified: the x86_64 build cross-compiled on arm64 lists all three
#   certificates off a real token under Rosetta.
#
# Windows: x64 only.
#   The token middleware is x64. An ARM64-native build could not load it, and
#   Windows on ARM runs the x64 build under emulation where the x64 driver
#   loads normally. An arm64 build would be strictly worse.
#
# Linux: built on the oldest supported Ubuntu, not the newest.
#   glibc is backward but not forward compatible, so a binary built against a
#   new glibc refuses to start on an older distro. Building on the oldest
#   runner sets the floor as low as the runner images allow.
#
# Do not "fix" any of these by adding architectures. Each one costs a download
# choice and buys nothing the emulated path does not already cover.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
    # A doc-only change publishing a new version of three binaries is noise, and
    # the version number stops meaning anything if it moves for prose.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "learn/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # What version this is, and whether it gets published. The only job that knows
  # the difference between a merge to master and a manual run, so every other
  # job builds the checked-out commit and asks nothing.
  #
  # It runs first and everything needs it, so a merge that forgot the version
  # bump costs one job rather than twenty minutes of nine parallel builds.
  #
  # No tag is created here. `publish` creates it with the release, once the
  # builds have passed, so a failed run leaves nothing behind to clean up.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    # The bump this job pushes lands back on master as another push, which would
    # start another release, which would push again. Skipping its own commit is
    # what stops that.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      # The commit carrying the bumped versions. Every other job checks this
      # out rather than the merge commit, which still has the old numbers.
      sha: ${{ steps.commit.outputs.sha || steps.plan.outputs.sha }}
    steps:
      # Full history and tags: the bump compares every folder against the last
      # release, and a shallow clone has neither. BOT_TOKEN rather than the
      # default one because this job pushes; the fallback keeps manual runs
      # working before the secret exists, since those never push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - id: plan
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "building $(cat VERSION), publishing nothing (manual run)"
            exit 0
          fi

          # Nobody types a version for an ordinary release. Every component
          # whose folder changed since the last tag gets a patch bump, and the
          # release number moves with them. A bigger bump is typed on develop
          # before the merge, and this leaves that component alone because its
          # version has already moved.
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then
            python3 scripts/bump_version.py --auto "$prev"
          else
            echo "no previous tag: first release, shipping the versions as they are"
          fi

          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "releasing $version. component versions:"
          python3 scripts/bump_version.py

          # Only reachable on the first release, or if someone hand-edited
          # VERSION backwards: --auto always moves it past the last tag.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Check VERSION."
            exit 1
          fi

      # Pushed to master so the numbers in the repo are the numbers that were
      # released. It is also what the builds below check out, since the merge
      # commit still carries the old ones.
      - name: Commit the bump
        id: commit
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -eu
          git config user.name "DocSigner Bot"
          git config user.email "bot@resilient.tech"
          if git diff --quiet; then
            echo "no version moved (first release)"
          else
            git commit -am "chore(release): v${{ steps.plan.outputs.version }}"
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  host:
    needs: prepare
    name: host (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is arm64; the x86_64 toolchain cross-compiles cleanly
          # there, which avoids depending on the ageing Intel runner images.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          key: ${{ matrix.target }}

      # pcsc links against libpcsclite, which is not on the Ubuntu image.
      - name: Install PC/SC headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      # The archive is named for Cargo.toml's version, which is the host's own:
      # `prepare` has already checked it moved if host/ changed. Nothing here.

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The binary must be the architecture we claim. A silent host-arch build
      # would ship an arm64 macOS binary that cannot load an x86_64 driver,
      # which is the exact failure this matrix exists to avoid.
      - name: Verify the architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/docsigner-host
          file "$binary"
          file "$binary" | grep -q 'x86.64' || { echo "::error::not an x86_64 binary"; exit 1; }

      # Runs natively on Linux and Windows. Skipped on macOS: the arm64 runner
      # has no Rosetta, so the x86_64 binary cannot execute there. It is
      # exercised on a real Mac before release instead.
      - name: Smoke test
        if: runner.os != 'macOS'
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/docsigner-host
          [ "${{ runner.os }}" = "Windows" ] && binary="$binary.exe"
          "$binary" version
          "$binary" version | grep -q '"protocolVersion": 1'

      - name: Package
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          stage="docsigner-host-${version}-${{ matrix.name }}"
          mkdir -p "dist/$stage"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/docsigner-host.exe "dist/$stage/"
          else
            cp target/${{ matrix.target }}/release/docsigner-host "dist/$stage/"
          fi
          cp README.md "dist/$stage/"
          # Apache-2.0 wants both travelling with the binary, not just in the repo.
          cp ../LICENSE ../NOTICE "dist/$stage/"
          cp -r packaging "dist/$stage/packaging"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$stage.zip" "$stage" >/dev/null
          else
            tar -czf "$stage.tar.gz" "$stage"
          fi
          rm -rf "$stage"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: host/dist/*
          if-no-files-found: error

  # The desktop .app, macOS only. Built here rather than by hand so the cask's
  # checksum comes off a reproducible build instead of somebody's laptop, which
  # is how an arm64 .dmg went out once.
  #
  # Runs on the arm64 runner but builds x86_64 throughout, the same bet the host
  # matrix makes. That needs Rosetta, since PyInstaller bundles whichever
  # interpreter runs it and cannot cross-compile. build-macos.sh owns all of
  # that logic and verifies the result with `file`; this job only supplies the
  # toolchains.
  desktop-macos:
    name: desktop (macos-x86_64)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # arch -x86_64 needs it, and the arm64 runner images do not ship it.
      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          key: desktop-x86_64-apple-darwin

      # No `version` here: desktop/frontend/package.json pins packageManager,
      # and action-setup refuses when both say so. It has to be pointed at that
      # file, though: the action reads ./package.json by default and this repo
      # has none at its root, which failed with "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5

      # The x86_64 interpreter build-macos.sh looks for.
      - name: Install an x86_64 CPython
        run: uv python install cpython-3.12-macos-x86_64

      - name: Build
        run: desktop/build-macos.sh

      # Named for the release page. build-macos.sh emits a bare DocSigner.dmg
      # because the cask takes the version from the tag in the URL path, not
      # from the filename.
      - name: Stage the artifact
        run: |
          mkdir -p artifacts
          cp desktop/backend/dist/DocSigner.dmg artifacts/DocSigner.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: artifacts/*
          if-no-files-found: error

  # The desktop app for Windows and Linux. There is no build-macos.sh equivalent
  # for these: the spec already handles both (it looks for the host binary under
  # host/target/release and appends .exe on Windows), so the job is the script.
  #
  # Native architecture, not cross-compiled, because PyInstaller bundles the
  # interpreter running it. That is x64 on both runners, which is what the token
  # middleware needs anyway (see the header).
  #
  # Neither has been opened on a real machine. They are published so a tester
  # has something to download; treat both as unverified until someone signs a
  # PDF with a token in them. docs/roadmap.md carries that as the open item.
  desktop:
    name: desktop (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            python: .venv/Scripts/python
          - name: linux-x64
            os: ubuntu-22.04
            python: .venv/bin/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          key: desktop-${{ matrix.name }}

      # libpcsclite for the host build; the rest is what pywebview's GTK backend
      # needs to be importable, since PyInstaller has to import it to collect it.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libgirepository1.0-dev \
            libcairo2-dev gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev

      # The sidecar. The spec refuses to build without it, and this is the
      # unsuffixed release path it looks for off macOS.
      - name: Build the sidecar host
        run: cargo build --release --manifest-path host/Cargo.toml

      # Same as the macOS job: the version comes from the frontend's
      # package.json, and the action has to be told where that is.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Build the frontend
        working-directory: desktop/frontend
        run: pnpm install && pnpm build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The cryptography<49 pin in requirements.txt is macOS-x86_64-only by
      # marker, so both of these resolve the current release.
      - name: Set up the venv
        working-directory: desktop/backend
        shell: bash
        run: |
          python -m venv .venv
          ${{ matrix.python }} -m pip install -q -r requirements.txt pyinstaller
          # pywebview needs the GTK bindings present to be collected, and they
          # are not in requirements.txt: that file serves the macOS build, where
          # the window is pyobjc.
          #
          # Pinned under 3.52, which moved to girepository-2.0 and so to glib
          # 2.80. Ubuntu 22.04 carries girepository-1.0 and the build dies in
          # meson without it. The runner stays 22.04 on purpose: it sets the
          # glibc floor for the binary this job produces, the same reason the
          # host matrix builds there. Raise the pin the day the floor moves,
          # not before.
          if [ "${{ runner.os }}" = "Linux" ]; then
            ${{ matrix.python }} -m pip install -q "pygobject<3.52"
          fi

      - name: Package
        working-directory: desktop/backend
        shell: bash
        run: |
          rm -rf dist build
          ${{ matrix.python }} -m PyInstaller --noconfirm ../packaging/docsigner-desktop.spec

      # The sidecar missing is the one failure that leaves a working-looking app
      # that cannot reach a token, and the spec's own check runs before the
      # collect step rather than after it.
      - name: Check the bundle carries the sidecar
        working-directory: desktop/backend
        shell: bash
        run: |
          host=docsigner-host
          [ "${{ runner.os }}" = "Windows" ] && host=docsigner-host.exe
          find dist/docsigner-desktop -name "$host" | grep -q . || {
            echo "::error::the sidecar host is not in the bundle"; exit 1; }
          find dist/docsigner-desktop -maxdepth 1 -name 'docsigner-desktop*'

      # 0.2.0 shipped with strip=True in the spec, and strip rewrote every PE in the
      # bundle into an image the Windows loader would not map, so the app died on
      # launch with "LoadLibrary: Invalid access to memory location". PyInstaller
      # copies the interpreter DLL verbatim, so a byte compare against the one the
      # build ran on catches that whole class of damage if it ever comes back.
      - name: Check the bundled Python DLL was not rewritten
        if: runner.os == 'Windows'
        working-directory: desktop/backend
        shell: bash
        run: |
          dll=$(basename "$(ls dist/docsigner-desktop/_internal/python3??.dll)")
          cmp "$(${{ matrix.python }} -c 'import sys; print(sys.base_prefix)')/$dll" \
              "dist/docsigner-desktop/_internal/$dll" || {
            echo "::error::$dll was rewritten during packaging (strip?); the bundle will not launch"; exit 1; }

      - name: Stage the artifact
        shell: bash
        run: |
          version=$(cat VERSION)
          mkdir -p artifacts
          cd desktop/backend/dist
          # A folder, not a single file: PyInstaller's onedir layout starts far
          # faster than onefile, which unpacks itself on every launch.
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../../../artifacts/DocSigner-$version-windows-x64.zip" docsigner-desktop >/dev/null
          else
            tar -czf "../../../artifacts/DocSigner-$version-linux-x64.tar.gz" docsigner-desktop
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  # The two extension zips, exactly as each store wants them. Cheap to build and
  # they make the store upload a download rather than a local build step.
  extension:
    name: extension
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chrome refuses Firefox's event-page background and Firefox needs one, so
      # the Firefox copy is generated rather than shared.
      - name: Build the Firefox copy
        run: python scripts/build_firefox_extension.py

      - name: Package
        run: |
          version=$(python -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          mkdir -p artifacts/chrome artifacts/firefox
          (cd extension && zip -qr "../artifacts/chrome/docsigner-extension-$version-chrome.zip" . -x '*.DS_Store')
          (cd dist/firefox-extension && zip -qr "../../artifacts/firefox/docsigner-extension-$version-firefox.zip" .)
          ls -lR artifacts

      # One artifact per store, not one holding both. Actions wraps an artifact
      # in a zip of its own, so a shared one made every store upload a zip
      # inside a zip that had to be opened first. `publish` merges them back
      # into a single folder, so the release page is unchanged.
      - uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: artifacts/chrome/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: artifacts/firefox/*
          if-no-files-found: error

  # The two packages that go to a registry rather than to a download button.
  # Built here so the release page carries exactly the file that was uploaded,
  # and so a broken package fails the release instead of the upload.
  core:
    name: core
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build core

      # PyPI rejects an upload whose metadata it cannot read, and it rejects it
      # after the version is spent. Cheaper to find out here.
      - name: Check the metadata PyPI will read
        run: twine check core/dist/*

      - name: Stage the artifact
        run: |
          mkdir -p artifacts
          cp core/dist/* artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: artifacts/*
          if-no-files-found: error

  js:
    name: js
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm pack builds the exact tarball `npm publish` would send, so this is
      # the upload rehearsed rather than described.
      - name: Pack
        run: |
          mkdir -p artifacts
          (cd js && npm pack --pack-destination ../artifacts)
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: js
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [prepare, host, desktop-macos, desktop, extension, core, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file for everything, so a download can be verified without
      # trusting the page it came from.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The formula and cask pin their downloads by checksum, and those
      # checksums only exist once the archives are built. Filling them in here
      # makes updating the tap a copy of two files with nothing to compute, and
      # a checksum nobody typed is a checksum nobody can typo.
      - name: Fill in the Homebrew checksums
        run: |
          version=$(cat VERSION)
          host_version=$(grep -m1 '^version' host/Cargo.toml | cut -d'"' -f2)
          host_sum=$(awk '/docsigner-host-.*-macos-x86_64\.tar\.gz$/ {print $1}' artifacts/SHA256SUMS)
          dmg_sum=$(awk '/DocSigner\.dmg$/ {print $1}' artifacts/SHA256SUMS)
          test -n "$host_sum" && test -n "$dmg_sum"

          # The cask interpolates version into its url, so two edits cover it.
          # The formula cannot (brew style wants url before version), so its url
          # is rewritten too. Both explained in the files themselves.
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v$version"
          sed -e "s/^  version \".*\"/  version \"$version\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$dmg_sum\"/" \
              desktop/packaging/homebrew/docsigner.rb > artifacts/docsigner.rb
          # The formula installs the host, so its version is the host's. The tag in
          # the path is the release's, and those two now move independently.
          sed -e "s|^  url \".*\"|  url \"$base/docsigner-host-$host_version-macos-x86_64.tar.gz\"|" \
              -e "s/^  version \".*\"/  version \"$host_version\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$host_sum\"/" \
              host/packaging/homebrew/docsigner-host.rb > artifacts/docsigner-host.rb

          grep -H 'version \|sha256 ' artifacts/docsigner.rb artifacts/docsigner-host.rb

      # The feed the host's checkUpdate command reads (CONTRACTS.md section 2).
      # `url` points at the release page rather than a file: the host never
      # downloads anything, it only tells the user a newer version exists, and
      # the page is where they choose the right one for their machine.
      #
      # `downloads` is additive and the host ignores it: it exists so a page, an
      # installer or a README link can resolve the current build of any component
      # without knowing the version. The asset filenames carry the version, so
      # releases/latest/download/<name> cannot be linked directly; this file can,
      # because GitHub keeps releases/latest/download/latest.json pointing here.
      # Built from the artifacts actually present, so a job that did not run is
      # absent rather than a dead link.
      - name: Build latest.json
        run: |
          # `version` is the host's: checkUpdate compares it against the host
          # the user has installed, so a release that did not change the host
          # must not claim a newer one. `tag` is the release, which is where
          # the files actually live.
          version=$(grep -m1 '^version' host/Cargo.toml | cut -d'"' -f2)
          tag=$(cat VERSION)
          repo="${{ github.server_url }}/${{ github.repository }}"
          python3 - "$version" "$repo" "$tag" <<'PY'
          import json, os, sys, time

          version, repo, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          base = f"{repo}/releases/download/v{tag}"

          # (key, match) in order; the first match wins, so the host archives are
          # matched before the desktop ones on the shared OS suffixes.
          KEYS = [
              ("host-macos", "docsigner-host-*-macos-x86_64.tar.gz"),
              ("host-windows", "docsigner-host-*-windows-x64.zip"),
              ("host-linux", "docsigner-host-*-linux-x64.tar.gz"),
              ("desktop-macos", "DocSigner.dmg"),
              ("desktop-windows", "DocSigner-*-windows-x64.zip"),
              ("desktop-linux", "DocSigner-*-linux-x64.tar.gz"),
              ("extension-chrome", "docsigner-extension-*-chrome.zip"),
              ("extension-firefox", "docsigner-extension-*-firefox.zip"),
              ("core-wheel", "docsigner_core-*.whl"),
              ("core-sdist", "docsigner_core-*.tar.gz"),
              ("js-tarball", "docsigner-[0-9]*.tgz"),
          ]

          from fnmatch import fnmatch
          present = sorted(os.listdir("artifacts"))
          downloads = {}
          for key, pattern in KEYS:
              hit = next((n for n in present if fnmatch(n, pattern)), None)
              if hit:
                  downloads[key] = f"{base}/{hit}"

          feed = {
              "version": version,
              # The host never downloads anything, it only says a newer version
              # exists, and the page is where a human picks the right file.
              "url": f"{repo}/releases/latest",
              "published": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "downloads": downloads,
          }
          with open("artifacts/latest.json", "w") as fh:
              json.dump(feed, fh, indent=2)
              fh.write("\n")
          PY
          cat artifacts/latest.json

      # The tag is created here, by the release itself, pointing at the merge
      # commit that triggered this run. That ordering is deliberate: a build
      # that fails leaves no tag to delete before the next attempt.
      - name: Release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            One download per operating system. Pick yours; there is no
            architecture to choose.

            | Your machine | Browser signing | Batch app |
            |---|---|---|
            | Any Mac, Intel or Apple Silicon | `docsigner-host-…-macos-x86_64.tar.gz` | `DocSigner.dmg` |
            | Windows | `docsigner-host-…-windows-x64.zip` | `DocSigner-…-windows-x64.zip` |
            | Linux | `docsigner-host-…-linux-x64.tar.gz` | `DocSigner-…-linux-x64.tar.gz` |

            Everything else this release built is attached too, one file per
            thing, so a single page has all of it:

            | File | For |
            |---|---|
            | `docsigner-extension-…-chrome.zip` | the Chrome Web Store upload |
            | `docsigner-extension-…-firefox.zip` | the Firefox add-ons upload |
            | `docsigner_core-….whl` / `.tar.gz` | the PyPI upload |
            | `docsigner-….tgz` | the npm upload |
            | `docsigner.rb`, `docsigner-host.rb` | the Homebrew tap |

            Most people should install the extension from its store listing
            rather than from the zip. Each component carries its own version, so
            a file whose number did not move since the last release is the same
            build on purpose: nothing in it changed.

            `latest.json` lists the current download URL for every one of these
            under `downloads`, which is the stable link to build against.

            Unpack it, then register it with your browsers:

            ```
            packaging/install.sh <chrome-extension-id>     # macOS / Linux
            packaging\install.bat <chrome-extension-id>    # Windows
            ```

            Your token's own driver still has to be installed separately. It is
            hardware middleware and cannot ride inside this binary.

            On macOS, Homebrew skips all of that and the Gatekeeper warning
            with it:

            ```
            brew install resilient-tech/tap/docsigner-host
            brew install --cask --no-quarantine resilient-tech/tap/docsigner
            ```

            `--no-quarantine` is part of the cask line, not a suggestion.
            Homebrew stamps every cask it installs and only releases it when
            asked, and the app is ad-hoc signed rather than notarized.

            The desktop batch-signing app is `DocSigner.dmg`. It carries its
            own copy of the host, so a `.dmg` install needs nothing else.

            Verify a download against `SHA256SUMS`. The `docsigner.rb` and
            `docsigner-host.rb` files here are the tap's, with the checksums
            already filled in.
