[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "opensigner"
version = "0.1.0"
description = "Digitally sign print format PDFs in Frappe with a DSC token or a server-held key, on top of OpenSigner"
authors = [{ name = "Resilient Tech", email = "smit@resilient.tech" }]
requires-python = ">=3.10"
dependencies = [
    # Until signer-core is on PyPI: pip install -e /path/to/document-signer/core
    # into the bench env first; this requirement is then already satisfied.
    "signer-core>=0.1.0",
]

[tool.flit.module]
name = "opensigner"
