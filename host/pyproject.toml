[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signer-host"
version = "0.1.0"
description = "OpenSigner native messaging host: PKCS#11 token signing for the browser extension"
requires-python = ">=3.9"
dependencies = [
    # >=0.8: lib.reinitialize(), which pkcs11_ops.load_library needs so a
    # long-lived host rescans tokens like a fresh process. Without it the
    # first scan's slot state is cached forever and a replugged token reads
    # as "no token found" until the host process dies.
    "python-pkcs11>=0.8",
    "asn1crypto",
]

[project.scripts]
opensigner-host = "signer_host.main:main"
opensigner-host-cli = "signer_host.cli:main"

[project.optional-dependencies]
test = ["pytest", "cryptography"]

[tool.setuptools]
packages = ["signer_host"]
