[package]
name = "docsigner-host"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "DocSigner native messaging host: DSC token access over PKCS#11 and the OS certificate stores"
license = "Apache-2.0"

[[bin]]
name = "docsigner-host"
path = "src/main.rs"

[dependencies]
cryptoki = "0.10"
pcsc = "2"
# default-features = false leaves "pem" behind, dropping the pem-rfc7468 crate:
# tokens and the OS store hand over DER and this binary base64s it itself, so no
# PEM is ever read or written. Worth 16 bytes of binary, measured — LTO already
# stripped the dead code. The point is one less crate in the graph, not size.
# "std" is the rest of the default set and is needed. const-oid is not listed
# either; der re-exports the parts used here.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
der = { version = "0.7", features = ["oid"] }
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = { version = "0.4", features = ["std"] }
dirs = "5"
notify-rust = "4"

# Blocking HTTP for the update check only. native-tls uses the TLS stack already
# on the machine (Schannel / SecureTransport / OpenSSL), which keeps ~2 MB of
# bundled rustls out of the binary for the sake of one JSON fetch.
#
# native-tls is named directly by update.rs, not just enabled here: ureq's
# feature supplies only the adapter, and the connector has to be handed to the
# AgentBuilder or every https request fails with "no TLS backend is configured".
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "gzip"] }
native-tls = "0.2"

# Only to pre-open PKCS#11 drivers with RTLD_DEEPBIND; pkcs11.rs says why.
# cryptoki already loads them through this crate, so this adds a line, not a crate.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_System_Memory",
] }

[target.'cfg(windows)'.build-dependencies]
# Only to embed the icon and version resource in the .exe (see build.rs).
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
