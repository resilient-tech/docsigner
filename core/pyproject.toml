[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signer-core"
version = "0.1.0"
description = "Digital signing on top of pyHanko: interrupted signing sessions, PAdES/CAdES/XAdES, validation"
requires-python = ">=3.10"
dependencies = [
    "pyhanko[image-support]>=0.35",
    "cryptography",
    # XAdES assembly (xades.py); pyHanko covers PAdES and CAdES but not XML.
    "signxml>=5",
    # QR panel in composed stamps (appearance.qr_url).
    "qrcode>=7",
]

[tool.setuptools.packages.find]
include = ["signer_core*"]

[tool.setuptools.package-data]
signer_core = ["fonts/*"]
